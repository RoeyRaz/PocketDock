name: Android debug APK

# During early development, run builds only when explicitly requested or on a PR.
# This avoids an email and a new build for every small commit to main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test phone Runner
        run: python -m unittest discover -s runner/tests -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # v3 tried to install the removed Android SDK "tools" package.
      # v4 plus an explicit package list avoids that failure.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocketdock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
